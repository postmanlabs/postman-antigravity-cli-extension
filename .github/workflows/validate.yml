name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON manifests
        run: |
          python -c "import json; json.load(open('plugin.json'))"
          python -c "import json; json.load(open('mcp_config.json'))"

      - name: Validate TOML commands
        run: |
          import glob, tomllib
          files = glob.glob('commands/**/*.toml', recursive=True)
          assert files, 'no command TOML files found'
          for f in files:
              with open(f, 'rb') as fh:
                  tomllib.load(fh)
              print(f'ok: {f}')
        shell: python

      - name: Check required plugin fields
        run: |
          import json, re
          m = json.load(open('plugin.json'))
          for field in ('name', 'version', 'description'):
              assert m.get(field), f'plugin.json missing required field: {field}'
          assert re.fullmatch(r'\d+\.\d+\.\d+', m['version']), \
              f"version must be semver X.Y.Z, got {m['version']!r}"
          print(f"plugin {m['name']} v{m['version']} looks valid")
        shell: python
