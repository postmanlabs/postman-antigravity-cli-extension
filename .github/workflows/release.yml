name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches plugin.json version
        run: |
          import json, os, sys
          tag = os.environ['GITHUB_REF_NAME']           # e.g. v1.0.0
          tag_version = tag.lstrip('v')
          manifest_version = json.load(open('plugin.json'))['version']
          if tag_version != manifest_version:
              sys.exit(
                  f"tag {tag} ({tag_version}) does not match "
                  f"plugin.json version {manifest_version}"
              )
          print(f"tag {tag} matches plugin.json version {manifest_version}")
        shell: python

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
