description = "Generate typed client CODE from a Postman collection — reads your APIs and writes production-ready client code matching your project. Requires Code or Full mode. Usage: /postman:generate-client [collection name] [language]"

prompt = """
Generate typed client code from a Postman collection. Read the collection's requests, bodies, params, and responses, then write production-ready client code that matches this project's conventions.

This authors client code FROM an existing Postman collection — it is the inverse of /postman:generate-spec (which authors an OpenAPI spec FROM your codebase).

Collection name and/or target language (optional): {{args}}

## Prerequisites

This command relies on the code-generation MCP tools — `getCodeGenerationInstructions` and the detailed `getCollectionFolder` / `getCollectionRequest` / `getCollectionResponse` tools. These are only exposed when the Postman MCP Server runs in **Code mode** (https://mcp.postman.com/code) or **Full mode** (https://mcp.postman.com/mcp). This extension defaults to the **minimal** endpoint (https://mcp.postman.com/minimal), where they are NOT available.

- If MCP tools aren't available at all, tell the user: "Run /postman:setup to configure the Postman MCP Server."
- If the codegen tools specifically are missing, call `getEnabledTools` to confirm the active tool set, then tell the user: "Generating client code requires Code or Full mode. Switch with /postman:use-remote code (or /postman:use-remote full), or set the postman server url to https://mcp.postman.com/code (or https://mcp.postman.com/mcp) in mcp_config.json, then restart Antigravity. You can switch back to a local server with /postman:use-local."

## Workflow

### Step 1: Find the API
1. Call `searchPostmanElements` with the API name and `entityType: collections`. Set `ownership` from the user's intent:
   - `ownership: organization` (default) for the user's org — add `filters: {"$and":[{"privateNetwork":{"$eq":true}}]}` to restrict to the trusted Private API Network.
   - `ownership: external` for third-party public APIs.
   - `ownership: all` to search everywhere.
2. If results are sparse, broaden the search (widen `ownership`, relax filters) or fall back to `getWorkspaces` + `getCollections` (with the `workspace` parameter and a `name` filter).
3. Match by name or ask the user which collection to generate code from.
4. Call `getCollection` (full model) for the complete collection — all requests, bodies, and params.
5. Call `getSpecDefinition` if a linked spec exists (richer type information).
6. Call `getCodeGenerationInstructions` for the MCP server's recommended codegen workflow.

### Step 2: Understand the API Shape
1. `getCollectionFolder` for each folder to understand resource grouping.
2. `getCollectionRequest` for each relevant endpoint — method, URL, headers, auth, request body schema, path/query params.
3. `getCollectionResponse` for each request — status codes, response body shapes (for typing), error formats.
4. `getEnvironment` for base URLs and variables.

### Step 3: Detect Project Language
If the user doesn't specify a language, detect it from the project:

| File | Language |
|------|----------|
| `package.json` + `tsconfig.json` | TypeScript |
| `package.json` (no tsconfig) | JavaScript |
| `requirements.txt` or `pyproject.toml` | Python |
| `go.mod` | Go |
| `Cargo.toml` | Rust |
| `pom.xml` or `build.gradle` | Java |
| `*.csproj` | C# |
| `Gemfile` | Ruby |

### Step 4: Generate Code
Generate a client that includes a typed client class/module (one method per endpoint), request/response types from the collection schemas and examples, authentication handling from the collection auth config (Bearer, API key, OAuth2), typed error handling from documented error schemas, environment-based configuration (base URL from env vars), and pagination support if the API uses cursor/offset pagination.

The generated code should match the project's existing conventions (imports, formatting, naming), include doc comments from collection descriptions, reuse the project's existing HTTP library if present (axios, fetch, requests, reqwest, etc.), use language-appropriate camelCase/snake_case, and handle query params, path params, headers, and request bodies correctly.

### Step 5: Write and Present
Write the code to an appropriate location — e.g. `src/clients/<api-name>.ts` (TS/JS), `src/clients/<api_name>.py` (Python), `pkg/clients/<apiname>.go` (Go). Then present a summary of the endpoints covered (method → method name), the types generated, the auth method, and the base URL source.

## Error Handling

- **MCP not configured:** "Run /postman:setup to configure the Postman MCP Server."
- **Codegen tools unavailable (wrong mode):** Confirm with `getEnabledTools`, then: "Generating client code requires Code or Full mode — set the postman server url to https://mcp.postman.com/code (or https://mcp.postman.com/mcp) in mcp_config.json (or use /postman:use-remote code) and restart Antigravity."
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **Collection not found:** "No collection matching that name. Run /postman:search to see what's available."
- **No requests in collection:** "This collection is empty. Add requests in Postman first, or use /postman:sync to create from a spec."
- **Can't detect language:** "I can't detect the project language. What language should I generate the client in?"
- **Spec not available:** "No linked spec found. I'll generate types from the collection's saved examples and request bodies."
- **Missing auth config:** "This collection doesn't specify an auth method. I'll generate the client without auth — you can add it later."
"""
