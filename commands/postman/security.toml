description = "Security-audit your APIs against the OWASP API Top 10. Finds vulnerabilities and provides remediation guidance. Usage: /postman:security [spec or collection]"

prompt = """
Audit an API for security issues: missing auth, exposed sensitive data, insecure transport, weak validation, and OWASP API Security Top 10 alignment. Works with local OpenAPI specs and Postman collections.

Target (optional): {{args}}

## Prerequisites

For collection auditing, the Postman MCP Server must be connected. Local spec auditing works without MCP. If needed, tell the user: "Run /postman:setup to configure the Postman MCP Server."

## Workflow

### Step 1: Find the Source
Call `getWorkspaces` for the workspace ID (ask which if multiple).
- **Local spec:** search for `**/openapi.{json,yaml,yml}`, `**/swagger.{json,yaml,yml}`.
- **Postman spec (MCP):** `getAllSpecs` with the workspace ID, then `getSpecDefinition`.
- **Postman collection (MCP):** `getCollections` with the `workspace` parameter, `getCollection` for detail incl. auth config, `getEnvironment` to check for exposed secrets.

### Step 2: Run Security Checks
- **Authentication/Authorization:** security schemes defined; applied globally or per-endpoint; no endpoints accidentally unprotected; OAuth2 scopes appropriate; admin endpoints have elevated auth.
- **Transport:** all server URLs HTTPS; no mixed HTTP/HTTPS.
- **Sensitive data exposure:** no keys/tokens/passwords in examples; no secrets in query params (use headers/body); password fields `format: password`; PII identified; environment variables checked for leaked secrets (`getEnvironment`).
- **Input validation:** parameter types defined; string `maxLength`; numeric `minimum`/`maximum`; array `maxItems`; enums where applicable; required-field validation.
- **Rate limiting:** limits documented; rate-limit headers defined; 429 response defined.
- **Error handling:** no stack traces or internal field names leaked; 401/403 defined; messages don't reveal implementation details.
- **OWASP API Top 10 alignment:** API1 Broken Object Level Authorization; API2 Broken Authentication; API3 Broken Object Property Level Authorization; API4 Unrestricted Resource Consumption; API5 Broken Function Level Authorization; API6 Unrestricted Access to Sensitive Business Flows; API7 SSRF; API8 Security Misconfiguration; API9 Improper Inventory Management; API10 Unsafe Consumption of APIs.

### Step 3: Present Results
Group findings by severity (CRITICAL/HIGH/MEDIUM) with an ID, description, and affected endpoints, then a score out of 100.

### Step 4: Fix
For each finding: explain the risk in plain terms, show the exact spec change, and apply with user approval. For Postman-specific issues: `putEnvironment` to mark secrets, `updateCollectionRequest` to fix auth config, `updateCollectionResponse` to remove sensitive data from examples.

### Step 5: Re-audit
After fixes, re-run the audit to show improvement.

## Error Handling

- **MCP not configured:** Local spec auditing works without MCP. For Postman-specific checks: "Run /postman:setup to configure the Postman MCP Server."
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **No spec found:** Ask for the path; offer to audit a Postman collection directly via MCP.
- **Spec too large:** For 100+ endpoints, audit in batches by tag or path prefix.
- **Plan limitations:** "Some audit features may require a paid Postman plan. Check https://www.postman.com/pricing/"
"""
