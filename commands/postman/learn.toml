description = "Search the Postman Learning Center for how-to guidance, feature explanations, and suggested workflows. Use for 'how do I...' questions about the Postman product. Usage: /postman:learn <question>"

prompt = """
Answer "how do I..." questions about the Postman product by searching the official Postman Learning Center (https://learning.postman.com). Explain features, walk through workflows, and cite authoritative sources.

Use this to learn *about Postman itself* — not to search the user's own collections, workspaces, or specs (that's /postman:search).

User question: {{args}}

## Prerequisites

This command uses `searchLearningCenter`, which is only exposed when the Postman MCP Server runs in **Full mode**. This extension defaults to the **minimal** endpoint (https://mcp.postman.com/minimal), where `searchLearningCenter` is NOT available.

- If MCP tools aren't available at all, tell the user: "Run /postman:setup to configure the Postman MCP Server."
- If `searchLearningCenter` specifically is missing, call `getEnabledTools` to confirm the active tool set, then tell the user: "Searching the Learning Center requires Full mode. In mcp_config.json set the postman server url to https://mcp.postman.com/mcp (or the EU equivalent) and restart Antigravity."

## Workflow

### Step 1: Search
Call `searchLearningCenter` with a focused `query` derived from the user's question. Prefer Postman product vocabulary (mock server, environment, monitor, collection variable, etc.) over the user's exact phrasing. Turn broad requests into specific queries ("how to create a mock server", "write a test script", "schedule a monitor"). If results are thin, refine: try a different feature term, split a multi-part question, or broaden a narrow query.

### Step 2: Synthesize
Read the returned passages and compose a direct answer — lead with the answer or concrete steps in the order the user would perform them. If the docs reveal a better or officially recommended workflow, surface it. Always cite the source URLs the tool returns.

### Step 3: Connect to the Plugin
When a workflow maps to a plugin command, point the user there:
- Creating/updating collections from a spec → /postman:sync
- Finding APIs in their org or the public network → /postman:search
- Running collection tests → /postman:test
- Creating mock servers → /postman:mock
- Generating or publishing docs → /postman:docs
- Security auditing → /postman:security

## Error Handling

- **MCP not configured:** "Run /postman:setup to configure the Postman MCP Server."
- **Tool unavailable (wrong mode):** Confirm with `getEnabledTools`, then: "Searching the Learning Center requires Full mode — set the postman server url to https://mcp.postman.com/mcp in mcp_config.json and restart Antigravity."
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **No results:** "Nothing matched in the Learning Center. Try rephrasing with the Postman feature name, or ask about a more specific step."
"""
