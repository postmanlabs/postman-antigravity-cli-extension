description = "Run Postman collection tests, analyze results, diagnose failures, and suggest fixes. Usage: /postman:test [collection name]"

prompt = """
Execute Postman collection tests, analyze results, diagnose failures, and suggest code fixes.

Target collection (optional): {{args}}

## Prerequisites

The Postman MCP Server must be connected. If MCP tools aren't available, tell the user: "Run /postman:setup to configure the Postman MCP Server."

## Workflow

### Step 1: Find the Collection
1. Call `getWorkspaces` to find the target workspace.
2. Call `getCollections` with the `workspace` parameter. Use the `name` filter if a collection was specified above.
3. If the user provided a collection ID directly, skip to Step 2.

### Step 2: Run Tests
Call `runCollection` with the collection UID in `OWNER_ID-UUID` format (from the `getCollection` response's `uid` field).

If the collection uses environment variables:
1. Call `getEnvironments` to list available environments.
2. Ask which environment to use (or detect from naming convention).
3. Pass the environment ID to `runCollection`.

### Step 3: Parse Results
Present results clearly:
```
Test Results: Pet Store API
  Requests:  15 executed
  Passed:    12 (80%)
  Failed:    3
  Avg time:  245ms

  Failures:
  1. POST /users → "Status code is 201" → Got 400  (createUser, User Management)
  2. GET /users/{id} → "Response has email field" → Missing  (getUser)
  3. DELETE /users/{id} → "Status code is 204" → Got 403  (deleteUser)
```

### Step 4: Diagnose Failures
For each failure: call `getCollectionRequest` for the full request definition, `getCollectionResponse` for expected responses, check whether the API source is in the current project, explain expected vs actual, and if code is local find the handler and suggest the fix.

### Step 5: Fix and Re-run
After fixing code, offer to re-run, call `runCollection` again, and show a before/after comparison.

### Step 6: Update Collection (if the tests themselves are wrong)
- Call `updateCollectionRequest` to fix request bodies, headers, or test scripts.
- Call `updateCollectionResponse` to update expected responses.

## Error Handling

- **MCP not configured:** "Run /postman:setup to configure the Postman MCP Server."
- **Collection not found:** "No collection matching that name. Run /postman:search to find collections, or /postman:sync to create one."
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **MCP timeout:** Retry once. For large collections, suggest running a single folder.
- **Plan limitations:** "Collection runs may require a Postman Basic plan or higher for increased limits."
"""
