description = "Discover APIs across your Postman workspaces. Ask natural-language questions about available endpoints and capabilities. Usage: /postman:search <question>"

prompt = """
Answer a natural-language question about available APIs across the user's Postman workspaces. Find endpoints, check response shapes, and understand what's available.

User question: {{args}}

## Prerequisites

The Postman MCP Server must be connected. If MCP tools aren't available, tell the user: "Run /postman:setup to configure the Postman MCP Server."

## Workflow

### Step 1: Search

Use the unified `searchPostmanElements` tool. It can search across entity types like requests, collections, workspaces, specs, flows, environments and mocks. Choose `entityType`, `ownership`, and `filters` based on the user's intent.

1. Call `searchPostmanElements` with the user's query:
   - `entityType`: `requests` (default), `collections`, `workspaces`, `specs`, or `flows`.
   - `ownership`: `organization` (default — your org's resources), `external` (public Postman network, third-party APIs), or `all` (both).
   - `filters`: Optional structured `$and` expression to narrow results — e.g. restrict to the Private API Network, a workspace, or an HTTP method.
2. If results are sparse, broaden the search — widen `ownership` to `all`, drop or relax filters, or try a different `entityType`. You can also fall back to `getWorkspaces` + `getCollections` for browsing, or `getTaggedEntities` to find collections by tag.

**Filter examples:**
- Private API Network only: `ownership: organization` with `filters: {"$and":[{"privateNetwork":{"$eq":true}}]}`
- Third-party public API (e.g. "Stripe API"): `ownership: external` with `filters: {"$and":[{"visibility":{"$eq":"public"}}]}`
- Specific workspace: `filters: {"$and":[{"workspaceId":{"$eq":"ws-abc123"}}]}`
- GET requests only: `entityType: requests` with `filters: {"$and":[{"method":{"$eq":"GET"}}]}`

### Step 2: Drill Into Results

For each relevant hit: call `getCollection` for the overview, scan endpoint names/descriptions, call `getCollectionRequest` for the most relevant endpoints, `getCollectionResponse` to show available data, and `getSpecDefinition` if a linked spec exists.

### Step 3: Present

Format results as a clear answer to the user's question — confirm whether the capability exists, name the endpoint, collection, and auth, and show a sample response shape. If multiple results, list relevant collections with endpoint counts and ask which to explore.

## Error Handling

- **MCP not configured:** "Run /postman:setup to configure the Postman MCP Server."
- **No results:** Try different keywords, broaden `ownership` to `all`, or browse workspaces with `getWorkspaces` + `getCollections`.
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **Too many results:** Ask the user to be more specific; suggest filtering by workspace or tag.
"""
