description = "Switch this plugin's Postman MCP server to LOCAL (stdio via the npx package), keeping the current toolset. Usage: /postman:use-local [minimal|code|full|learn]"

prompt = """
Switch the Postman MCP server for this plugin from the remote hosted server to the LOCAL stdio package (`@postman/postman-mcp-server`, run via `npx`) by rewriting the plugin's own `mcp_config.json` in place. **Keep whatever toolset is already configured** — only change the transport (remote → local), not the toolset, unless the user explicitly asks for a different one.

Optional toolset override (leave empty to keep the current toolset; one of `minimal`, `code`, `full`, `learn`): {{args}}

## Step 1 — Locate this plugin's mcp_config.json
!{found=""; for root in "$HOME/.gemini/config/plugins" "$HOME/.agents/plugins" "$PWD/.agents/plugins"; do [ -d "$root" ] || continue; for f in "$root"/*/mcp_config.json; do [ -f "$f" ] || continue; if grep -q '"postman"' "$f"; then echo "FOUND: $f"; echo "--- current content ---"; cat "$f"; echo; found=1; fi; done; done; [ -z "$found" ] && echo "(No plugin mcp_config.json found. Run 'agy plugin list' and ask the user which plugin directory to edit.)"}

Use the `FOUND:` path above as the target file to edit. If no `FOUND:` line appeared, stop and ask the user for the path to the installed plugin's `mcp_config.json`.

## Step 2 — Verify the API key
The local server authenticates with a Postman API key read from the environment (there is no OAuth for the local package).
!{if [ -n "$POSTMAN_API_KEY" ]; then echo "POSTMAN_API_KEY is set in this environment ✅"; else echo "POSTMAN_API_KEY is NOT set ❌"; fi}

If it is not set, tell the user to run `export POSTMAN_API_KEY=<their-key>` and add that line to `~/.zshrc` or `~/.bashrc` so it persists, then to restart the shell before continuing. They can get a key at https://postman.postman.co/settings/me/api-keys. Never hardcode the key into the file — it is read from the environment.

## Step 3 — Determine the current toolset (preserve it)
Inspect the current content printed in Step 1 and read off which toolset it is already using:
- **Remote form** (`serverUrl`): the URL path is the toolset — `/code` → `code`, `/mcp` → `full`, `/learn` → `learn`, `/minimal` (or any other) → `minimal`.
- **Local form** (`command`/`args`): the flag in `args` is the toolset — `--code` → `code`, `--full` → `full`, `--learn` → `learn`, no mode flag → `minimal`.

**If the user passed an override in `{{args}}`, use that instead.** Otherwise use the detected toolset. If the current content is missing/unreadable and no override was given, default to `minimal` and say so.

Map the toolset to the local flag:
- `minimal`: no mode flag
- `code`: add `"--code"` to `args`
- `full`: add `"--full"` to `args`
- `learn`: add `"--learn"` to `args`

If the current config used the EU region (EU host or `--region eu`), or the user's Postman account is in the EU region, also add `"--region", "eu"` to `args`.

## Step 4 — Overwrite the target mcp_config.json
Write EXACTLY this content to the `FOUND:` path, inserting the mode/region flags from Step 3 into `args` (for `minimal`, add no mode flag):

```json
{
  "mcpServers": {
    "postman": {
      "command": "npx",
      "args": ["-y", "@postman/postman-mcp-server@latest"],
      "env": {
        "POSTMAN_API_KEY": "$POSTMAN_API_KEY"
      }
    }
  }
}
```

The `$POSTMAN_API_KEY` reference is expanded by Antigravity from your environment (the same pattern the remote `headers` config uses); the spawned stdio process also inherits your shell environment.

## Step 5 — Confirm and restart
Print the new file content back to the user and state which toolset was kept (or which override was applied), then tell them to **restart the `agy` session** (or reload servers via *Additional Options (…) → MCP Servers*) for the change to take effect. Remind them they can switch back to the hosted server at any time with `/postman:use-remote`.
"""
