description = "Generate, improve, and publish API documentation from Postman collections and OpenAPI specs. Usage: /postman:docs [collection or spec]"

prompt = """
Analyze, improve, and publish API documentation from OpenAPI specs and Postman collections.

Target (optional): {{args}}

## Prerequisites

The Postman MCP Server must be connected for Postman operations. Local spec analysis works without MCP. If needed, tell the user: "Run /postman:setup to configure the Postman MCP Server."

## Workflow

### Step 1: Find the Source
Call `getWorkspaces` for the workspace ID (ask which if multiple). Look for API definitions in this order:
- **Local specs:** search for `**/openapi.{json,yaml,yml}`, `**/swagger.{json,yaml,yml}`.
- **Postman specs:** `getAllSpecs` with the workspace ID, then `getSpecDefinition` for the full spec.
- **Postman collections:** `getCollections` with the `workspace` parameter, then `getCollection` for detail.

### Step 2: Analyze Documentation Completeness
Assess coverage — endpoints with descriptions, parameters with descriptions, examples, error responses documented, auth documented, rate limits documented — and report a coverage percentage.

### Step 3: Generate or Improve
- **Sparse spec:** generate per-endpoint docs (summary/description, parameter table, request/response schemas with examples, error responses, per-endpoint auth).
- **Partial spec:** fill gaps (infer missing descriptions from naming/schemas, generate examples, add error responses, document auth and rate limits).

### Step 4: Apply Changes
Ask which output the user wants:
1. **Update the spec file** — write improved docs back into the OpenAPI spec.
2. **Update in Postman** — `updateCollectionRequest` to add descriptions/examples to each request.
3. **Publish public docs** — `publishDocumentation` (`collectionId`, plus `customColor`/`customization` for branding); returns a public URL. `unpublishDocumentation` to remove.
4. **Generate markdown** — create `docs/api-reference.md` in the project.

### Step 5: Sync Spec and Collection
If both exist: `syncCollectionWithSpec` to update the collection from the spec (**async, HTTP 202** — poll `getCollectionUpdatesTasks` with increasing waits; OpenAPI 3.0 only), or `syncSpecWithCollection` to update the spec from collection changes.

## Error Handling

- **MCP not configured:** Local markdown docs work without MCP. For Postman publishing: "Run /postman:setup to configure the Postman MCP Server."
- **401 Unauthorized:** "Your Postman API key was rejected. Generate a new one at https://go.postman.co/settings/me/api-keys and run /postman:setup."
- **Invalid spec:** Report parse errors and offer to fix common YAML/JSON syntax issues.
- **Plan limitations:** "Publishing documentation may require a paid Postman plan. Check https://www.postman.com/pricing/"
- **Too many results:** Ask the user to specify a collection by name.
"""
